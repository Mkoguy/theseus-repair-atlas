<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theseus — mobile preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; justify-items: center; align-content: start; gap: 16px; background: #e8efed; color: #15322f; font: 16px system-ui, sans-serif; padding: 12px; }
    h1 { font-size: 1.25rem; margin: 8px 0 0; }
    iframe { display: block; height: min(844px, calc(100dvh - 75px)); width: min(100%, 390px); background: #fff; border: 1px solid #567571; border-radius: 14px; box-shadow: 0 16px 55px #12302b33; }
  </style>
</head>
<body>
  <h1>Theseus · 390 px mobile preview</h1>
  <iframe src="/" title="Theseus at phone width"></iframe>
</body>
</html>
